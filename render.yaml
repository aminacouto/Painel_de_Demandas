services:
  - type: web
    name: painel-de-demandas
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: GITHUB_REPO
      - key: GITHUB_TOKEN
      - key: YEAR
        value: "2026"
      - key: DEBUG
        value: "False"
      - key: HOST
        value: "0.0.0.0"
