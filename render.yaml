services:
  - type: web
    name: painel-de-demandas
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server
    envVars:
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: YEAR
        value: "2026"
      - key: DEBUG
        value: "False"
      - key: HOST
        value: "0.0.0.0"